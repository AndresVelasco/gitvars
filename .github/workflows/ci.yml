name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[demo]'
      - run: python -m unittest discover -s tests -v
      - name: Exercise installed console command and demo
        run: |
          gitvars --version
          python demo/build.py
          gitvars render demo/index.html --html-escape --output-dir build --force
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
