<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Let your deployed assets point back to their source. gitvars documentation and a live demonstration of every variable.">
    <title>gitvars</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f7f8fa;
        --surface: #fff;
        --text: #1c2839;
        --muted: #526177;
        --accent: #1859ad;
        --border: #dce2eb;
        --code: #edf1f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101723;
          --surface: #182232;
          --text: #e5ecf5;
          --muted: #a7b6cc;
          --accent: #94bdff;
          --border: #334257;
          --code: #222f43;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--background); color: var(--text); line-height: 1.7; }
      main { max-width: 75rem; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
      h1 { font-size: clamp(3rem, 7vw, 4.5rem); line-height: 1.1; letter-spacing: -.05em; margin: 0 0 1.5rem; }
      h2 { border-top: 1px solid var(--border); padding-top: 2rem; margin-top: 3rem; letter-spacing: -.025em; line-height: 1.3; }
      h3 { margin-top: 2rem; line-height: 1.4; }
      p, li { max-width: 65rem; }
      main > p:first-of-type { font-size: 1.2rem; }
      a { color: var(--accent); text-underline-offset: .2em; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: .25rem; }
      code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em; }
      :not(pre) > code { background: var(--code); padding: .15em .3em; border-radius: .25rem; overflow-wrap: anywhere; }
      pre { background: var(--code); border-radius: .5rem; padding: 1rem; overflow-x: auto; line-height: 1.6; }
      pre code { font-size: .9rem; }
      table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin-block: 1.25rem; text-align: left; }
      th, td { padding: .8rem 1rem; border: 1px solid var(--border); vertical-align: top; }
      thead th { background: var(--code); font-size: .9rem; }
      tbody th { font-weight: 500; }
      .live-demo { margin-block: 2rem; padding: 1.25rem; background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; }
      .live-demo > p { margin-top: 0; color: var(--muted); }
      .live-demo table { margin-bottom: 0; }
      .live-demo th code { white-space: nowrap; }
      .live-demo td { min-width: 15rem; }
      .value { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
      .empty { color: var(--muted); font-style: italic; }
      @media (max-width: 40rem) {
        main { padding: 2rem 1rem 3rem; }
        .live-demo { padding: .75rem; }
        th, td { padding: .65rem; }
      }
    </style>
  </head>
  <body>
    <main id="readme-content">
<!-- README_CONTENT -->
    </main>
  </body>
</html>
