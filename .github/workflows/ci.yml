name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.8.17'
      - run: uv sync --locked --extra demo
      - run: uv run --locked --extra demo python -m unittest discover -s tests -v
      - name: Exercise installed console command and demo
        run: |
          uv run --locked --extra demo gitvars --version
          uv run --locked --extra demo python demo/build.py
          uv run --locked --extra demo gitvars render demo/index.html --html-escape --output-dir build --force
      - name: Build distributions
        run: |
          uv build --no-sources
