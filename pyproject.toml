[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitvars"
version = "0.1.0"
description = "Render Git provenance into text templates without network access."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andres Velasco"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
gitvars = "gitvars.cli:main"

[project.optional-dependencies]
demo = ["markdown-it-py>=4,<5"]

[project.urls]
Repository = "https://github.com/AndresVelasco/gitvars"

[tool.setuptools.packages.find]
where = ["src"]
