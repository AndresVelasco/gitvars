name: Demo pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.17'
      - run: uv sync --locked --extra demo
      - run: uv run --locked --extra demo python -m unittest discover -s tests -v
      - name: Build HTML with Git placeholders
        run: uv run --locked --extra demo python demo/build.py
      - name: Render Git values into the Pages output
        run: uv run --locked --extra demo gitvars render demo/index.html --html-escape --output-dir build --force
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          # This directory becomes the site root, so index.html is the homepage.
          path: build/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
